name: Build Windows desktop app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows-native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC)
        run: cmake -S . -B build/native -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build/native --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: MTGTrackerDesktop-Windows-x64
          path: build/native/Release/MTGTrackerDesktop.exe
  docker-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker toolchain
        run: docker build -t mtg-tracker-desktop-builder .
      - name: Cross-compile
        run: docker run --rm -v "${{ github.workspace }}:/src" -w /src mtg-tracker-desktop-builder
      - uses: actions/upload-artifact@v4
        with:
          name: MTGTrackerDesktop-Docker-x64
          path: build/windows/MTGTrackerDesktop.exe
