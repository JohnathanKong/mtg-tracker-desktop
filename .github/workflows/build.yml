name: Build MTG Tracker Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows native GUI and packaged executable
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/windows --config Release --parallel 2
      - name: Bundle Qt and QML dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/windows/Release/MTGTrackerDesktop.exe dist/MTGTrackerDesktop.exe
          windeployqt --release --compiler-runtime --qmldir qml dist/MTGTrackerDesktop.exe
      - name: QML launch smoke test (offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QSG_RHI_BACKEND = "software"
          $proc = Start-Process -FilePath "$PWD\dist\MTGTrackerDesktop.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Qt/QML smoke test failed with exit code $($proc.ExitCode)" }
      - name: Publish portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: MTGTrackerDesktop-Windows-Portable
          path: dist/
          if-no-files-found: error

  docker-windows:
    name: Docker cross-compile and package Windows x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate a Windows checkout with CRLF shell scripts
        run: |
          python3 -c "from pathlib import Path; p=Path('scripts/build-windows.sh'); p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n'))"
      - name: Build Windows cross-compiler Docker image
        run: docker build -t mtg-tracker-desktop-builder .
      - name: Compile and package Windows executable INSIDE Docker
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src mtg-tracker-desktop-builder
      - name: Verify Windows PE and packaged Qt runtime
        run: |
          test -s dist/windows/MTGTrackerDesktop.exe
          test "$(head -c 2 dist/windows/MTGTrackerDesktop.exe)" = MZ
          test -s dist/windows/Qt6Core.dll
          test -s dist/windows/Qt6Quick.dll
          test -s dist/windows/platforms/qwindows.dll
          file dist/windows/MTGTrackerDesktop.exe
          file dist/windows/MTGTrackerDesktop.exe | grep -E 'PE32[+]? executable'
      - name: Publish Docker-built portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: MTGTrackerDesktop-Docker-Windows-x64
          path: dist/windows/
          if-no-files-found: error
